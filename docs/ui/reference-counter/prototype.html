<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Session counter reference</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			min-height: 100vh;
			background: #d3dce4;
			font:
				16px system-ui,
				sans-serif;
			color: #f1f5f9;
		}
		main {
			position: fixed;
			top: 16px;
			left: 50%;
			transform: translateX(-50%);
			width: calc(100% - 32px);
			max-width: 360px;
			height: 224px;
			padding: 16px;
			border-radius: 12px;
			background: #101827;
			text-align: center;
		}
		h1 {
			font-size: 16px;
			margin: 0;
			line-height: 24px;
		}
		output {
			display: block;
			font-size: 40px;
			font-weight: 700;
			line-height: 64px;
		}
		p {
			color: #b4c0d3;
			font-size: 14px;
			margin: 0 0 16px;
			line-height: 24px;
		}
		button {
			width: 100%;
			height: 48px;
			border: 0;
			border-radius: 8px;
			background: #8de0bd;
			color: #101827;
			font: 700 16px system-ui;
			cursor: pointer;
		}
		button:disabled {
			background: #334155;
			color: #b4c0d3;
			cursor: default;
		}
		button:focus-visible {
			outline: 3px solid white;
			outline-offset: 3px;
		}
	</style>
	<main aria-label="Session counter">
		<h1>Session counter</h1>
		<output>0</output>
		<p aria-live="polite">Ready to add one</p>
		<button>Add one</button>
	</main>
	<script>
		const state = new URLSearchParams(location.search).get("state");
		const status = document.querySelector("p"),
			button = document.querySelector("button"),
			value = document.querySelector("output");
		if (state)
			status.textContent =
				{
					connecting: "Connecting…",
					pending: "Waiting for server…",
					retry: "No reply yet. Try again.",
					capped: "Session limit reached",
				}[state] || status.textContent;
		button.disabled = ["connecting", "pending", "capped"].includes(state);
		if (state === "capped") value.textContent = "100";
		button.onclick = () => {
			button.disabled = true;
			status.textContent = "Waiting for server…";
			setTimeout(() => {
				value.textContent = Number(value.textContent) + 1;
				button.disabled = false;
				status.textContent = "Ready to add one";
			}, 300);
		};
	</script>
</html>
